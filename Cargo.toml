[package]
name = "hash-id"
version = "2.0.0"
edition = "2021"
authors = ["PasswordCracking Team"]
description = "Modern hash identification tool with hashcat/john integration"
license = "MIT"

[[bin]]
name = "hash-id"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"